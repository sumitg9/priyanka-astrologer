<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="agold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff6dd"/>
      <stop offset="35%" stop-color="#e2bf7d"/>
      <stop offset="70%" stop-color="#c8a66b"/>
      <stop offset="100%" stop-color="#876625"/>
    </linearGradient>
    <radialGradient id="abg" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#2a1e45"/>
      <stop offset="50%" stop-color="#18152c"/>
      <stop offset="85%" stop-color="#0f0c1c"/>
      <stop offset="100%" stop-color="#080710"/>
    </radialGradient>
    <radialGradient id="soulGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5e0aa" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#c8a66b" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#c8a66b" stop-opacity="0"/>
    </radialGradient>
    <filter id="goldShine" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep Sacred Etheric Background -->
  <rect width="500" height="500" fill="url(#abg)" rx="14"/>

  <!-- Outer Astral Orbit & Degree Rings -->
  <circle cx="250" cy="250" r="236" fill="none" stroke="url(#agold)" stroke-width="1.5" stroke-opacity="0.35"/>
  <circle cx="250" cy="250" r="226" fill="none" stroke="url(#agold)" stroke-width="1" stroke-dasharray="3,5" stroke-opacity="0.4"/>
  <circle cx="250" cy="250" r="216" fill="none" stroke="url(#agold)" stroke-width="0.8" stroke-opacity="0.25"/>

  <!-- Outer Orbit Nodes (12 Cosmic Dimensions) -->
  <g fill="url(#agold)">
    <circle cx="250" cy="14" r="3"/>
    <circle cx="250" cy="486" r="3"/>
    <circle cx="14" cy="250" r="3"/>
    <circle cx="486" cy="250" r="3"/>
    <circle cx="83" cy="83" r="2.5"/>
    <circle cx="417" cy="83" r="2.5"/>
    <circle cx="83" cy="417" r="2.5"/>
    <circle cx="417" cy="417" r="2.5"/>
    <circle cx="368" cy="132" r="2"/>
    <circle cx="132" cy="368" r="2"/>
    <circle cx="132" cy="132" r="2"/>
    <circle cx="368" cy="368" r="2"/>
  </g>

  <!-- Sacred Geometry: Merkabah / 12-Rayed Star of Transcendence -->
  <g stroke="url(#agold)" stroke-width="1.2" fill="none" stroke-opacity="0.65">
    <!-- Concentric Sacred Circles -->
    <circle cx="250" cy="250" r="190"/>
    <circle cx="250" cy="250" r="150" stroke-dasharray="4,6"/>
    <circle cx="250" cy="250" r="105"/>

    <!-- Interlocking Hexagrams (Merkabah / Soul Vessel) -->
    <polygon points="250,60 362,254 138,254"/>
    <polygon points="250,440 138,246 362,246"/>
    <!-- Second rotated pair creating 12-point star -->
    <polygon points="60,250 254,362 254,138" stroke-opacity="0.35"/>
    <polygon points="440,250 246,138 246,362" stroke-opacity="0.35"/>
  </g>

  <!-- Ray Filigree -->
  <g stroke="url(#agold)" stroke-width="0.75" stroke-opacity="0.35">
    <line x1="250" y1="20" x2="250" y2="480"/>
    <line x1="20" y1="250" x2="480" y2="250"/>
    <line x1="87" y1="87" x2="413" y2="413"/>
    <line x1="413" y1="87" x2="87" y2="413"/>
  </g>

  <!-- Center Core Soul Glow -->
  <circle cx="250" cy="250" r="95" fill="url(#soulGlow)"/>

  <!-- Open Book of Life / Akasha Glyph -->
  <g transform="translate(250, 246)">
    <!-- Radiating Star Rays from Center -->
    <g fill="url(#agold)">
      <!-- 8-Point Center Star -->
      <path d="M0,-38 L5,-12 L30,0 L5,12 L0,38 L-5,12 L-30,0 L-5,-12 Z" filter="url(#goldShine)"/>
      <path d="M-22,-22 L-8,-3 L-3,-8 Z" opacity="0.6"/>
      <path d="M22,-22 L8,-3 L3,-8 Z" opacity="0.6"/>
      <path d="M-22,22 L-8,3 L-3,8 Z" opacity="0.6"/>
      <path d="M22,22 L8,3 L3,8 Z" opacity="0.6"/>
    </g>

    <!-- Center Eternal Soul Core -->
    <circle cx="0" cy="0" r="8" fill="#ffffff" filter="url(#goldShine)"/>
    <circle cx="0" cy="0" r="4" fill="#fcf6e6"/>

    <!-- Open Chronicle Wings / Pages of Akasha -->
    <path d="M -5,14 Q -28,8 -52,18 Q -48,34 -25,28 Q -8,25 0,35 Q 8,25 25,28 Q 48,34 52,18 Q 28,8 5,14 Z" 
          fill="none" stroke="url(#agold)" stroke-width="1.8" stroke-opacity="0.85"/>
    <path d="M -5,18 Q -26,12 -46,22" fill="none" stroke="url(#agold)" stroke-width="1" stroke-opacity="0.5"/>
    <path d="M 5,18 Q 26,12 46,22" fill="none" stroke="url(#agold)" stroke-width="1" stroke-opacity="0.5"/>
  </g>

  <!-- Sanskrit Inscription: आकाश (Akasha) -->
  <text x="250" y="145" fill="#fcefc7" font-family="'Cormorant Garamond', Georgia, serif" font-size="28" font-weight="700" letter-spacing="6" text-anchor="middle" filter="url(#goldShine)">आकाश</text>
  <text x="250" y="166" fill="#c8a66b" font-family="'DM Sans', sans-serif" font-size="9" font-weight="600" letter-spacing="3" text-anchor="middle">AKASHIC RECORDS</text>

  <!-- Bottom Arch Label -->
  <text x="250" y="348" fill="#e8d7b3" font-family="'Cormorant Garamond', Georgia, serif" font-size="14" font-weight="600" letter-spacing="3" text-anchor="middle">THE LIVING SOUL CHRONICLE</text>
  <text x="250" y="366" fill="#c8a66b" font-family="'DM Sans', sans-serif" font-size="8.5" font-weight="500" letter-spacing="2" text-anchor="middle">PAST LIVES · KARMIC CLEARING · HIGHER PURPOSE</text>

  <!-- Surrounding Stellar Constellation Sparkles -->
  <g fill="url(#agold)" opacity="0.85">
    <path d="M120,110 L122,115 L127,117 L122,119 L120,124 L118,119 L113,117 L118,115 Z"/>
    <path d="M380,110 L382,115 L387,117 L382,119 L380,124 L378,119 L373,117 L378,115 Z"/>
    <path d="M100,270 L102,274 L106,276 L102,278 L100,282 L98,278 L94,276 L98,274 Z"/>
    <path d="M400,270 L402,274 L406,276 L402,278 L400,282 L398,278 L394,276 L398,274 Z"/>
    <path d="M160,390 L162,394 L166,396 L162,398 L160,402 L158,398 L154,396 L158,394 Z"/>
    <path d="M340,390 L342,394 L346,396 L342,398 L340,402 L338,398 L334,396 L338,394 Z"/>
  </g>
</svg>

