<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="kgold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5ecd5"/>
      <stop offset="50%" stop-color="#c8a66b"/>
      <stop offset="100%" stop-color="#9a7a40"/>
    </linearGradient>
    <radialGradient id="kbg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a1b36"/>
      <stop offset="70%" stop-color="#191d2c"/>
      <stop offset="100%" stop-color="#121520"/>
    </radialGradient>
    <filter id="kglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="500" height="500" fill="url(#kbg)" rx="12"/>
  
  <!-- Decorative Border -->
  <rect x="20" y="20" width="460" height="460" fill="none" stroke="url(#kgold)" stroke-width="1.5" stroke-opacity="0.4" rx="8"/>
  <rect x="30" y="30" width="440" height="440" fill="none" stroke="url(#kgold)" stroke-width="1" stroke-dasharray="4,4" stroke-opacity="0.3"/>
  
  <!-- Outer Square -->
  <rect x="50" y="50" width="400" height="400" fill="none" stroke="url(#kgold)" stroke-width="2.5" filter="url(#kglow)"/>
  
  <!-- Diagonal X Lines -->
  <line x1="50" y1="50" x2="450" y2="450" stroke="url(#kgold)" stroke-width="2"/>
  <line x1="50" y1="450" x2="450" y2="50" stroke="url(#kgold)" stroke-width="2"/>
  
  <!-- Inner Diamond -->
  <polygon points="250,50 450,250 250,450 50,250" fill="none" stroke="url(#kgold)" stroke-width="2" filter="url(#kglow)"/>
  
  <!-- Central Lagna Symbol & Text -->
  <circle cx="250" cy="150" r="18" fill="#c8a66b" fill-opacity="0.15" stroke="url(#kgold)" stroke-width="1"/>
  <text x="250" y="156" fill="#e8d7b3" font-family="'Cormorant Garamond', Georgia, serif" font-size="20" font-weight="700" text-anchor="middle">१</text>
  <text x="250" y="125" fill="#c8a66b" font-family="'DM Sans', sans-serif" font-size="11" letter-spacing="2" text-anchor="middle">LAGNA · तनु</text>
  
  <!-- House Numbers & Planetary Indicators -->
  <!-- House 2 -->
  <text x="150" y="100" fill="#e8d7b3" font-family="'Cormorant Garamond', serif" font-size="16" font-weight="600" text-anchor="middle">२ धन</text>
  <text x="150" y="125" fill="#c8a66b" font-family="'DM Sans', sans-serif" font-size="10" text-anchor="middle">☽ चन्द्र</text>
  
  <!-- House 3 -->
  <text x="100" y="150" fill="#e8d7b3" font-family="'Cormorant Garamond', serif" font-size="16" font-weight="600" text-anchor="middle">३ सहज</text>
  <text x="100" y="175" fill="#c8a66b" font-family="'DM Sans', sans-serif" font-size="10" text-anchor="middle">☿ बुध</text>
  
  <!-- House 4 -->
  <text x="150" y="250" fill="#e8d7b3" font-family="'Cormorant Garamond', serif" font-size="18" font-weight="700" text-anchor="middle">४ सुख</text>
  <text x="150" y="275" fill="#f5ecd5" font-family="'DM Sans', sans-serif" font-size="11" text-anchor="middle">♀ शुक्र</text>
  
  <!-- House 5 -->
  <text x="100" y="350" fill="#e8d7b3" font-family="'Cormorant Garamond', serif" font-size="16" font-weight="600" text-anchor="middle">५ सुत</text>
  <text x="100" y="375" fill="#c8a66b" font-family="'DM Sans', sans-serif" font-size="10" text-anchor="middle">♃ गुरु</text>
  
  <!-- House 6 -->
  <text x="150" y="400" fill="#e8d7b3" font-family="'Cormorant Garamond', serif" font-size="16" font-weight="600" text-anchor="middle">६ रिपु</text>
  <text x="150" y="425" fill="#c8a66b" font-family="'DM Sans', sans-serif" font-size="10" text-anchor="middle">♂ मङ्गल</text>
  
  <!-- House 7 -->
  <text x="250" y="350" fill="#e8d7b3" font-family="'Cormorant Garamond', serif" font-size="18" font-weight="700" text-anchor="middle">७ जाया</text>
  <text x="250" y="375" fill="#f5ecd5" font-family="'DM Sans', sans-serif" font-size="11" text-anchor="middle">☉ सूर्य</text>
  
  <!-- House 8 -->
  <text x="350" y="400" fill="#e8d7b3" font-family="'Cormorant Garamond', serif" font-size="16" font-weight="600" text-anchor="middle">८ मृत्यु</text>
  <text x="350" y="425" fill="#c8a66b" font-family="'DM Sans', sans-serif" font-size="10" text-anchor="middle">☊ राहु</text>
  
  <!-- House 9 -->
  <text x="400" y="350" fill="#e8d7b3" font-family="'Cormorant Garamond', serif" font-size="16" font-weight="600" text-anchor="middle">९ भाग्य</text>
  <text x="400" y="375" fill="#c8a66b" font-family="'DM Sans', sans-serif" font-size="10" text-anchor="middle">♃ बृहस्पति</text>
  
  <!-- House 10 -->
  <text x="350" y="250" fill="#e8d7b3" font-family="'Cormorant Garamond', serif" font-size="18" font-weight="700" text-anchor="middle">१० कर्म</text>
  <text x="350" y="275" fill="#f5ecd5" font-family="'DM Sans', sans-serif" font-size="11" text-anchor="middle">♄ शनि</text>
  
  <!-- House 11 -->
  <text x="400" y="150" fill="#e8d7b3" font-family="'Cormorant Garamond', serif" font-size="16" font-weight="600" text-anchor="middle">११ आय</text>
  <text x="400" y="175" fill="#c8a66b" font-family="'DM Sans', sans-serif" font-size="10" text-anchor="middle">☋ केतु</text>
  
  <!-- House 12 -->
  <text x="350" y="100" fill="#e8d7b3" font-family="'Cormorant Garamond', serif" font-size="16" font-weight="600" text-anchor="middle">१२ व्यय</text>
  <text x="350" y="125" fill="#c8a66b" font-family="'DM Sans', sans-serif" font-size="10" text-anchor="middle">व्यय भाव</text>
  
  <!-- Bottom Caption -->
  <text x="250" y="480" fill="#c8a66b" font-family="'DM Sans', sans-serif" font-size="11" letter-spacing="3" text-anchor="middle">VEDIC JANAM KUNDALI · BIRTH CHART</text>
</svg>