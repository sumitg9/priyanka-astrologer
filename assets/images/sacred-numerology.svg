<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="ngold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4da"/>
      <stop offset="50%" stop-color="#c8a66b"/>
      <stop offset="100%" stop-color="#8a6929"/>
    </linearGradient>
    <radialGradient id="nbg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2d1b38"/>
      <stop offset="65%" stop-color="#171b29"/>
      <stop offset="100%" stop-color="#0f1118"/>
    </radialGradient>
  </defs>

  <rect width="500" height="500" fill="url(#nbg)" rx="12"/>
  
  <!-- Outer Sacred Geometry Circles -->
  <circle cx="250" cy="240" r="190" fill="none" stroke="url(#ngold)" stroke-width="1.2" stroke-opacity="0.35"/>
  <circle cx="250" cy="240" r="140" fill="none" stroke="url(#ngold)" stroke-width="1" stroke-dasharray="3,6" stroke-opacity="0.4"/>
  <circle cx="250" cy="240" r="90" fill="none" stroke="url(#ngold)" stroke-width="1.5" stroke-opacity="0.25"/>

  <!-- Vedic Lo-Shu Matrix (3x3 grid) -->
  <g stroke="url(#ngold)" stroke-width="2" fill="none">
    <rect x="115" y="105" width="270" height="270" rx="6"/>
    <line x1="115" y1="195" x2="385" y2="195"/>
    <line x1="115" y1="285" x2="385" y2="285"/>
    <line x1="205" y1="105" x2="205" y2="375"/>
    <line x1="295" y1="105" x2="295" y2="375"/>
  </g>

  <!-- Number Cells with Astrological Rulers (Lo Shu Grid) -->
  <!-- 4: Rahu -->
  <text x="160" y="152" fill="#f5ecd5" font-family="'Cormorant Garamond', Georgia, serif" font-size="34" font-weight="700" text-anchor="middle">4</text>
  <text x="160" y="176" fill="#c8a66b" font-family="'DM Sans', sans-serif" font-size="9" text-anchor="middle">RAHU · राहु</text>

  <!-- 9: Mars -->
  <text x="250" y="152" fill="#f5ecd5" font-family="'Cormorant Garamond', Georgia, serif" font-size="34" font-weight="700" text-anchor="middle">9</text>
  <text x="250" y="176" fill="#c8a66b" font-family="'DM Sans', sans-serif" font-size="9" text-anchor="middle">MARS · मङ्गल</text>

  <!-- 2: Moon -->
  <text x="340" y="152" fill="#f5ecd5" font-family="'Cormorant Garamond', Georgia, serif" font-size="34" font-weight="700" text-anchor="middle">2</text>
  <text x="340" y="176" fill="#c8a66b" font-family="'DM Sans', sans-serif" font-size="9" text-anchor="middle">MOON · चन्द्र</text>

  <!-- 3: Jupiter -->
  <text x="160" y="242" fill="#f5ecd5" font-family="'Cormorant Garamond', Georgia, serif" font-size="34" font-weight="700" text-anchor="middle">3</text>
  <text x="160" y="266" fill="#c8a66b" font-family="'DM Sans', sans-serif" font-size="9" text-anchor="middle">JUPITER · गुरु</text>

  <!-- 5: Mercury (Center) -->
  <circle cx="250" cy="240" r="34" fill="#c8a66b" fill-opacity="0.12"/>
  <text x="250" y="244" fill="#f5ecd5" font-family="'Cormorant Garamond', Georgia, serif" font-size="38" font-weight="700" text-anchor="middle">5</text>
  <text x="250" y="268" fill="#e8d7b3" font-family="'DM Sans', sans-serif" font-size="9" font-weight="700" text-anchor="middle">MERCURY · बुध</text>

  <!-- 7: Ketu -->
  <text x="340" y="242" fill="#f5ecd5" font-family="'Cormorant Garamond', Georgia, serif" font-size="34" font-weight="700" text-anchor="middle">7</text>
  <text x="340" y="266" fill="#c8a66b" font-family="'DM Sans', sans-serif" font-size="9" text-anchor="middle">KETU · केतु</text>

  <!-- 8: Saturn -->
  <text x="160" y="332" fill="#f5ecd5" font-family="'Cormorant Garamond', Georgia, serif" font-size="34" font-weight="700" text-anchor="middle">8</text>
  <text x="160" y="356" fill="#c8a66b" font-family="'DM Sans', sans-serif" font-size="9" text-anchor="middle">SATURN · शनि</text>

  <!-- 1: Sun -->
  <text x="250" y="332" fill="#f5ecd5" font-family="'Cormorant Garamond', Georgia, serif" font-size="34" font-weight="700" text-anchor="middle">1</text>
  <text x="250" y="356" fill="#c8a66b" font-family="'DM Sans', sans-serif" font-size="9" text-anchor="middle">SUN · सूर्य</text>

  <!-- 6: Venus -->
  <text x="340" y="332" fill="#f5ecd5" font-family="'Cormorant Garamond', Georgia, serif" font-size="34" font-weight="700" text-anchor="middle">6</text>
  <text x="340" y="356" fill="#c8a66b" font-family="'DM Sans', sans-serif" font-size="9" text-anchor="middle">VENUS · शुक्र</text>

  <!-- Bottom Captions -->
  <text x="250" y="420" fill="#e8d7b3" font-family="'Cormorant Garamond', serif" font-size="16" letter-spacing="1" text-anchor="middle">Every row, column &amp; diagonal sums to 15</text>
  <text x="250" y="450" fill="#c8a66b" font-family="'DM Sans', sans-serif" font-size="11" letter-spacing="3" text-anchor="middle">VEDIC SACRED NUMEROLOGY · BLUEPRINT</text>
</svg>