<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="wgold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5dc"/>
      <stop offset="50%" stop-color="#c8a66b"/>
      <stop offset="100%" stop-color="#805d1e"/>
    </linearGradient>
    <radialGradient id="wbg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a1b38"/>
      <stop offset="60%" stop-color="#171b28"/>
      <stop offset="100%" stop-color="#0e1017"/>
    </radialGradient>
  </defs>

  <rect width="500" height="500" fill="url(#wbg)" rx="12"/>
  
  <!-- Circles -->
  <circle cx="250" cy="250" r="215" fill="none" stroke="url(#wgold)" stroke-width="2"/>
  <circle cx="250" cy="250" r="165" fill="none" stroke="url(#wgold)" stroke-width="1.2"/>
  <circle cx="250" cy="250" r="105" fill="none" stroke="url(#wgold)" stroke-width="1.2"/>
  <circle cx="250" cy="250" r="45" fill="none" stroke="url(#wgold)" stroke-width="1.5"/>

  <!-- Center Sun Symbol -->
  <circle cx="250" cy="250" r="8" fill="#e8d7b3"/>
  <circle cx="250" cy="250" r="20" fill="none" stroke="url(#wgold)" stroke-width="1" stroke-dasharray="2,3"/>

  <!-- 12 Radiating Rays (30 deg each) -->
  <g stroke="url(#wgold)" stroke-width="1" stroke-opacity="0.4">
    <line x1="250" y1="35" x2="250" y2="465"/>
    <line x1="35" y1="250" x2="465" y2="250"/>
    <line x1="98" y1="98" x2="402" y2="402"/>
    <line x1="98" y1="402" x2="402" y2="98"/>
    <line x1="142" y1="63" x2="358" y2="437"/>
    <line x1="63" y1="142" x2="437" y2="358"/>
    <line x1="63" y1="358" x2="437" y2="142"/>
    <line x1="142" y1="437" x2="358" y2="63"/>
  </g>

  <!-- 12 Zodiac Symbols placed around the wheel (r=190) -->
  <!-- Aries (0 deg approx) -->
  <text x="250" y="75" fill="#f5ecd5" font-family="serif" font-size="20" font-weight="bold" text-anchor="middle">♈ ARIES</text>
  <!-- Taurus (30 deg) -->
  <text x="345" y="100" fill="#f5ecd5" font-family="serif" font-size="18" font-weight="bold" text-anchor="middle">♉ TAURUS</text>
  <!-- Gemini (60 deg) -->
  <text x="415" y="175" fill="#f5ecd5" font-family="serif" font-size="18" font-weight="bold" text-anchor="middle">♊ GEMINI</text>
  <!-- Cancer (90 deg) -->
  <text x="425" y="256" fill="#f5ecd5" font-family="serif" font-size="18" font-weight="bold" text-anchor="middle">♋ CANCER</text>
  <!-- Leo (120 deg) -->
  <text x="415" y="335" fill="#f5ecd5" font-family="serif" font-size="18" font-weight="bold" text-anchor="middle">♌ LEO</text>
  <!-- Virgo (150 deg) -->
  <text x="345" y="410" fill="#f5ecd5" font-family="serif" font-size="18" font-weight="bold" text-anchor="middle">♍ VIRGO</text>
  <!-- Libra (180 deg) -->
  <text x="250" y="440" fill="#f5ecd5" font-family="serif" font-size="20" font-weight="bold" text-anchor="middle">♎ LIBRA</text>
  <!-- Scorpio (210 deg) -->
  <text x="155" y="410" fill="#f5ecd5" font-family="serif" font-size="18" font-weight="bold" text-anchor="middle">♏ SCORPIO</text>
  <!-- Sagittarius (240 deg) -->
  <text x="85" y="335" fill="#f5ecd5" font-family="serif" font-size="18" font-weight="bold" text-anchor="middle">♐ SAGITTARIUS</text>
  <!-- Capricorn (270 deg) -->
  <text x="75" y="256" fill="#f5ecd5" font-family="serif" font-size="18" font-weight="bold" text-anchor="middle">♑ CAPRICORN</text>
  <!-- Aquarius (300 deg) -->
  <text x="85" y="175" fill="#f5ecd5" font-family="serif" font-size="18" font-weight="bold" text-anchor="middle">♒ AQUARIUS</text>
  <!-- Pisces (330 deg) -->
  <text x="155" y="100" fill="#f5ecd5" font-family="serif" font-size="18" font-weight="bold" text-anchor="middle">♓ PISCES</text>

  <!-- Sanskrit Rashi Names on Inner Ring (r=135) -->
  <text x="250" y="132" fill="#c8a66b" font-family="'DM Sans', sans-serif" font-size="10" text-anchor="middle">मेष</text>
  <text x="315" y="150" fill="#c8a66b" font-family="'DM Sans', sans-serif" font-size="10" text-anchor="middle">वृषभ</text>
  <text x="360" y="200" fill="#c8a66b" font-family="'DM Sans', sans-serif" font-size="10" text-anchor="middle">मिथुन</text>
  <text x="365" y="254" fill="#c8a66b" font-family="'DM Sans', sans-serif" font-size="10" text-anchor="middle">कर्क</text>
  <text x="360" y="310" fill="#c8a66b" font-family="'DM Sans', sans-serif" font-size="10" text-anchor="middle">सिंह</text>
  <text x="315" y="360" fill="#c8a66b" font-family="'DM Sans', sans-serif" font-size="10" text-anchor="middle">कन्या</text>
  <text x="250" y="378" fill="#c8a66b" font-family="'DM Sans', sans-serif" font-size="10" text-anchor="middle">तुला</text>
  <text x="185" y="360" fill="#c8a66b" font-family="'DM Sans', sans-serif" font-size="10" text-anchor="middle">वृश्चिक</text>
  <text x="140" y="310" fill="#c8a66b" font-family="'DM Sans', sans-serif" font-size="10" text-anchor="middle">धनु</text>
  <text x="135" y="254" fill="#c8a66b" font-family="'DM Sans', sans-serif" font-size="10" text-anchor="middle">मकर</text>
  <text x="140" y="200" fill="#c8a66b" font-family="'DM Sans', sans-serif" font-size="10" text-anchor="middle">कुम्भ</text>
  <text x="185" y="150" fill="#c8a66b" font-family="'DM Sans', sans-serif" font-size="10" text-anchor="middle">मीन</text>
</svg>